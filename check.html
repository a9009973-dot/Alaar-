<!doctype html>
<html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#eceef6"><title>فحص PWA — وتر</title><style>body{font:16px system-ui;max-width:760px;margin:2rem auto;padding:0 1rem;background:#eceef6;color:#171725}li{margin:.65rem 0}.ok{color:#087a3e}.bad{color:#b42318}code{direction:ltr;unicode-bidi:embed}</style><h1>فحص PWA — وتر</h1><p id="summary">جارٍ الفحص…</p><ul id="results"></ul><script>
(async()=>{const files=['index.html','manifest.webmanifest','sw.js','storage.js','icon-192.png','icon-512.png','maskable-192.png','maskable-512.png','apple-touch-icon.png','favicon-32.png','check.html'];const ul=document.querySelector('#results');let failed=0;function row(name,ok,detail=''){if(!ok)failed++;const li=document.createElement('li');li.className=ok?'ok':'bad';li.textContent=(ok?'✓ ':'✗ ')+name+(detail?' — '+detail:'');ul.append(li)}for(const f of files){try{const r=await fetch('./'+f,{method:'HEAD',cache:'no-store'});row('الملف '+f,r.ok,r.ok?'HTTP '+r.status:'غير موجود')}catch(e){row('الملف '+f,false,e.message)}}try{const r=await fetch('./manifest.webmanifest');const m=await r.json();const ok=m.name&&m.short_name&&m.start_url==='./index.html'&&m.scope==='./'&&m.display==='standalone'&&m.lang==='ar'&&m.dir==='rtl'&&Array.isArray(m.icons)&&m.icons.length>=2;row('صلاحية manifest',!!ok,ok?'الحقول والأيقونات الأساسية صحيحة':'حقول مطلوبة ناقصة')}catch(e){row('صلاحية manifest',false,e.message)}if('serviceWorker'in navigator){try{const reg=await navigator.serviceWorker.register('./sw.js');await navigator.serviceWorker.ready;row('تسجيل Service Worker',!!reg.active,reg.active?'نشط':'قيد التفعيل')}catch(e){row('تسجيل Service Worker',false,e.message)}}else row('تسجيل Service Worker',false,'غير مدعوم');document.querySelector('#summary').textContent=failed?'اكتمل الفحص: توجد '+failed+' مشكلة.':'اكتمل الفحص بنجاح.'})();
</script></html>
